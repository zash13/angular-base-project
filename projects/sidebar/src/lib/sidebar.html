<!-- sidebar.html -->
<head>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
  />
</head>
<nav
  class="sidebar mat-elevation-z4"
  [ngClass]="{
    'sidebar-collapsed': state.collapsed(),
    'sidebar-left': layout?.position === 'left',
    'sidebar-right': layout?.position === 'right',
    'sidebar-rtl': layout?.rtl || layout?.position === 'right',
    'sidebar-mobile': isMobile,
    'sidebar-with-backdrop': layout?.backdrop && isMobile,
    'light-theme': currentTheme.background === '#ffffff',
    'dark-theme': currentTheme.background !== '#ffffff',
    'with-top-navbar': true,
  }"
  [attr.data-theme]="currentTheme.background === '#ffffff' ? 'light' : 'dark'"
  [attr.dir]="layout?.rtl || layout?.position === 'right' ? 'rtl' : 'ltr'"
  [style]="getThemeCssVariables()"
>
  <!-- Mobile Backdrop -->
  @if (layout?.backdrop && isMobile && !state.collapsed()) {
    <div
      class="sidebar-backdrop mat-app-backdrop"
      [style.opacity]="0.5"
      (click)="requestToggle()"
    ></div>
  }

  <div class="sidebar-content" [class.cursor-pointer]="state.collapsed()" (click)="onSidebarContentClick()">
    <!-- Header -->
    <div class="sidebar-header-container">
      <lib-sidebar-header
        [config]="{
          collapsed: state.collapsed(),
          rtl: layout?.rtl ?? false,
          position: layout?.position ?? 'left',
          toggleButton: showToggleButton,
          isRtl: isRtl
        }"
        [logo]="config.branding?.logo ?? null"
        (toggleSidebar)="toggleSidebar()"
      ></lib-sidebar-header>
    </div>

    <!-- Profile -->
    @if (!state.collapsed() && showProfile) {
      <div class="sidebar-profile-container">
        <lib-sidebar-profile [user]="user" [collapsed]="state.collapsed()"></lib-sidebar-profile>
      </div>
    }

    <!-- Search -->
    @if (!state.collapsed() && showSearch) {
      <div class="sidebar-search-container">
        <lib-sidebar-search
          [searchText]="searchText"
          (searchChanged)="onSearch($event)"
        ></lib-sidebar-search>
      </div>
    }

    <!-- Scrollable Menu -->
    <div class="sidebar-menu-scroll-container">
      <cdk-virtual-scroll-viewport itemSize="48" class="sidebar-scroll-viewport">
        <lib-sidebar-menu
          [menus]="menus"
          [direction]="layout?.position ?? 'left'"
          [config]="{ collapsed: state.collapsed(), rtl: layout?.rtl ?? false }"
          (menuItemClicked)="menuItemClicked.emit($event)"
        ></lib-sidebar-menu>
      </cdk-virtual-scroll-viewport>
    </div>
  </div>

  <!-- Footer -->
  <div class="sidebar-footer-container">
    <lib-sidebar-footer
      [notifications]="notifications"
      [messages]="messages"
      [unreadNotificationsCount]="unreadNotificationsCount"
      [unreadMessagesCount]="unreadMessagesCount"
      [config]="getFooterConfig()"
      (logoutClicked)="onLogout()"
    ></lib-sidebar-footer>
  </div>
</nav>
