<header class="sidebar-header">
  <div class="header-content" [class.collapsed]="config?.collapsed">
    @if (logo) {
      <div class="logo-section">
        @if (logo.icon && !config?.collapsed) {
          <mat-icon class="logo-icon">{{ logo.icon }}</mat-icon>
        }

        @if (!config?.collapsed) {
          <div class="logo-text">
            @if (logo.url) {
              <a [href]="logo.url" class="logo-link">
                <h2 class="logo-title">{{ logo.text || 'Pro Sidebar' }}</h2>
              </a>
            } @else {
              <h2 class="logo-title">{{ logo.text || 'Pro Sidebar' }}</h2>
            }
          </div>
        }
      </div>
    }

    <!-- Toggle Button -->
    <button
      mat-icon-button
      class="toggle-button"
      (click)="toggleSidebar.emit()"
      [matTooltip]="config?.collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      matTooltipPosition="right"
    >
      <mat-icon>{{ config?.collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>
</header>
