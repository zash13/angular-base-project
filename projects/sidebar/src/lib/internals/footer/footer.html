<div class="sidebar-footer" [attr.dir]="config?.rtl ? 'rtl' : 'ltr'">
  <div class="footer-actions" [ngClass]="config?.rtl ? 'items-start justify-start' : 'items-start justify-start'">
    <!-- Notifications -->
    @if (shouldShowButton('notifications')) {
      <div class="relative">
        <button
          type="button"
          class="notification-btn footer-btn"
          [class.collapsed]="isCollapsed"
          (click)="toggleNotifications()"
          [title]="isCollapsed ? 'Notifications' : ''"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>

          @if (unreadNotificationsCount > 0 && !isCollapsed) {
            <span
              class="notification-badge absolute -top-1 -right-1 flex h-5 min-w-5 items-center justify-center rounded-full px-1 text-xs font-medium shadow-sm"
              [style.background-color]="config?.rtl ? 'var(--sidebar-error)' : 'var(--sidebar-error)'"
              [style.color]="'white'"
            >
              {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
            </span>
          }
        </button>

        <!-- Notifications Dropdown -->
        @if (showNotifications) {
          <div class="notifications-dropdown">
            <!-- ... keep existing dropdown content ... -->
          </div>
        }
      </div>
    }

    <!-- Messages -->
    @if (shouldShowButton('messages')) {
      <div class="relative">
        <button
          type="button"
          class="messages-btn footer-btn"
          [class.collapsed]="isCollapsed"
          (click)="toggleMessages()"
          [title]="isCollapsed ? 'Messages' : ''"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>

          @if (unreadMessagesCount > 0 && !isCollapsed) {
            <span
              class="messages-badge absolute -top-1 -right-1 flex h-5 min-w-5 items-center justify-center rounded-full px-1 text-xs font-medium shadow-sm"
              [style.background-color]="config?.rtl ? 'var(--sidebar-info)' : 'var(--sidebar-info)'"
              [style.color]="'white'"
            >
              {{ unreadMessagesCount > 99 ? '99+' : unreadMessagesCount }}
            </span>
          }
        </button>

        <!-- Messages Dropdown -->
        @if (showMessages) {
          <div class="messages-dropdown">
            <!-- ... keep existing dropdown content ... -->
          </div>
        }
      </div>
    }

    <!-- Settings -->
    @if (shouldShowButton('settings')) {
      <div class="relative">
        <button
          type="button"
          class="settings-btn footer-btn"
          [class.collapsed]="isCollapsed"
          (click)="toggleSettings()"
          [title]="isCollapsed ? 'Settings' : ''"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </button>

        <!-- Settings Dropdown -->
        @if (showSettings) {
          <div class="settings-dropdown">
            <!-- ... keep existing dropdown content ... -->
          </div>
        }
      </div>
    }

    <!-- Logout -->
    @if (shouldShowButton('logout')) {
      <div>
        <button
          type="button"
          class="logout-btn footer-btn"
          [class.collapsed]="isCollapsed"
          (click)="onLogout()"
          [title]="isCollapsed ? 'Logout' : ''"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
        </button>
      </div>
    }
  </div>
</div>
