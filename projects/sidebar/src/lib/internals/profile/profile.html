<div
  class="mx-3 my-2 rounded-md px-3 py-2 transition-all duration-200 ease-in-out bg-[var(--sidebar-profile-background)] text-[var(--sidebar-text)]"
  [class.collapsed]="collapsed"
>
  @if (!collapsed) {
    <div class="flex items-center gap-3">
      <img
        [src]="user?.avatar"
        [alt]="user?.name"
        class="shrink-0 h-9 w-9 rounded-full object-cover"
      />

      <div class="flex-1 min-w-0 leading-tight">
        <!-- Name -->
        <h3 class="text-sm font-semibold truncate">
          {{ user?.name }}
        </h3>

        <div class="flex items-center gap-2 text-xs text-[var(--sidebar-text-secondary)]">
          <p class="truncate">
            {{ user?.role }}
          </p>

          <span
            class="w-1.5 h-1.5 rounded-full"
            [ngClass]="{
              'bg-[var(--sidebar-success)]': user?.status === 'online',
              'bg-[var(--sidebar-error)]': user?.status === 'offline',
              'bg-[var(--sidebar-warning)]': user?.status === 'away',
            }"
          ></span>
        </div>
      </div>
    </div>
  } @else {
    <!-- Collapsed -->
    <div class="flex items-center justify-center py-2">
      <img [src]="user?.avatar" [alt]="user?.name" class="h-8 w-8 rounded-full object-cover" />
    </div>
  }
</div>
