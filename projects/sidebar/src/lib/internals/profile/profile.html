<div class="sidebar-profile" [class.collapsed]="collapsed">
  @if (!collapsed) {
    <div class="profile-expanded flex items-center gap-3 p-3">
      <img
        [src]="user?.avatar"
        [alt]="user?.name"
        class="profile-avatar h-10 w-10 rounded-full object-cover"
      />
      <div class="profile-info flex-1 overflow-hidden">
        <h3 class="profile-name text-sm font-semibold text-gray-800 truncate">
          {{ user?.name }}
        </h3>
        <p class="profile-role text-xs text-gray-500 truncate">{{ user?.role }}</p>
      </div>
      <div
        class="profile-status h-2 w-2 rounded-full"
        [ngClass]="{
          'bg-green-500': user?.status === 'online',
          'bg-gray-400': user?.status === 'offline',
          'bg-yellow-500': user?.status === 'away',
          'bg-red-500': user?.status === 'busy',
        }"
      ></div>
    </div>
  } @else {
    <div class="profile-collapsed flex items-center justify-center p-3">
      <img
        [src]="user?.avatar"
        [alt]="user?.name"
        class="profile-avatar-icon h-8 w-8 rounded-full object-cover"
      />
    </div>
  }
</div>
