<nav class="top-navbar fixed w-full z-10 border-b border-gray-200 shadow-sm">
  <div class="flex items-center justify-between my-2" [class]="containerClass">
    <a
      [href]="logo?.url || '#'"
      class="flex items-center gap-2 no-underline mx-8"
      [class.flex-row-reverse]="sidebarPosition === 'right'"
      [class]="logoMarginClass()"
    >
      @if (logo?.image) {
        <img [src]="logo?.image" [alt]="logo?.text || 'Logo'" class="h-8 w-auto" />
      } @else if (logo?.icon && logo?.iconType === 'mat-icon') {
        <span class="material-icons text-2xl text-gray-800">
          {{ logo?.icon }}
        </span>
      }
      <span class="text-xl font-semibold text-gray-900">
        {{ logo?.text || 'Application' }}
      </span>
    </a>

    @if (showToggleButton) {
      <button
        type="button"
        (click)="toggle()"
        class="inline-flex items-center justify-center w-10 h-10 p-2 text-sm text-gray-700 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
        [class]="toggleMarginClass()"
        [attr.aria-expanded]="!sidebarCollapsed"
        [attr.title]="sidebarCollapsed ? 'Open sidebar' : 'Close sidebar'"
      >
        <span class="sr-only">
          {{ sidebarCollapsed ? 'Open sidebar' : 'Close sidebar' }}
        </span>

        @if (sidebarCollapsed) {
          <span class="material-icons text-lg">{{ expandIcon }}</span>
        } @else {
          <span class="material-icons text-lg">{{ collapseIcon }}</span>
        }
      </button>
    }
  </div>
</nav>
